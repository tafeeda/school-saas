<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
    <div>
        {% if page_title %}
            <h2 class="text-2xl font-bold">{{ page_title }}</h2>
        {% endif %}
        {% if page_subtitle %}
            <p class="text-slate-500 mt-1">{{ page_subtitle }}</p>
        {% endif %}
    </div>

    <div class="flex gap-3">
        <button onclick="history.back()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-4 py-2 rounded-xl">
            Back
        </button>
        <a href="{% url 'dashboard_redirect' %}" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl">
            Home
        </a>
    </div>
</div>
