{% extends "base.html" %}

{% block content %}
{% include "partials/page_header.html" with page_title="Delete CBT Question" page_subtitle=exam.title %}
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 max-w-3xl">
    <p class="text-slate-700 mb-6">
        Are you sure you want to delete this question?
    </p>

    <form method="post" class="flex gap-3">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-semibold">
            Yes, Delete
        </button>
        <a href="{% url 'cbt_question_list' exam.id %}" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-6 py-3 rounded-xl font-semibold">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
