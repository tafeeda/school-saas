{% extends "base.html" %}

{% block content %}
<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
    <h3 class="text-xl font-bold mb-4">Delete Question</h3>

    <p class="mb-4">Are you sure you want to delete this question?</p>

    <form method="post">
        {% csrf_token %}
        <button class="bg-red-600 text-white px-4 py-2 rounded">Delete</button>
        <a href="{% url 'question_bank_list' %}" class="ml-3">Cancel</a>
    </form>
</div>
{% endblock %}
