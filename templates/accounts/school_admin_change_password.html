{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">

    <div class="mb-6">
        <a href="{% url 'school_admin_detail' school_admin.id %}" class="text-blue-600 hover:underline">← Back to Details</a>
        <h1 class="text-2xl font-bold text-slate-800 mt-3">Change School Admin Password</h1>
        <p class="text-slate-500 mt-1">Change password for {{ school_admin.username }}.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">New Password</label>
                <input type="password" name="new_password" required
                       class="w-full rounded-xl border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" required
                       class="w-full rounded-xl border border-slate-300 px-4 py-3">
            </div>

            <div class="flex justify-end gap-3 pt-4">
                <a href="{% url 'school_admin_detail' school_admin.id %}" class="px-5 py-3 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100">
                    Cancel
                </a>

                <button type="submit" class="px-5 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white shadow">
                    Change Password
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
