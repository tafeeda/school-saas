{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">

    <div class="mb-6">
        <a href="{% url 'super_admin_list' %}" class="text-blue-600 hover:underline">← Back to Super Admins</a>
        <h1 class="text-2xl font-bold text-slate-800 mt-3">Edit Super Admin</h1>
        <p class="text-slate-500 mt-1">Update account information for {{ super_admin.username }}.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" name="username" value="{{ super_admin.username }}" required
                       class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                <input type="email" name="email" value="{{ super_admin.email }}"
                       class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">First Name</label>
                    <input type="text" name="first_name" value="{{ super_admin.first_name }}"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Last Name</label>
                    <input type="text" name="last_name" value="{{ super_admin.last_name }}"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4">
                <a href="{% url 'super_admin_list' %}" class="px-5 py-3 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100">
                    Cancel
                </a>

                <button type="submit" class="px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white shadow">
                    Save Changes
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
