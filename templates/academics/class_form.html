{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h3 class="text-2xl font-bold mb-2">Create Class</h3>
        <p class="text-slate-500 mb-6">Add a class for the school.</p>

        <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium mb-2">Class Name</label>
                {{ form.name }}
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Category</label>
                {{ form.category }}
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Position Order</label>
                {{ form.position_order }}
            </div>

            <div class="md:col-span-2">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold">
                    Save Class
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
