{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h3 class="text-2xl font-bold mb-2">Create Grading Scheme</h3>
        <p class="text-slate-500 mb-6">Example: Default Secondary Scheme.</p>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium mb-2">Scheme Name</label>
                {{ form.name }}
            </div>

            <div class="flex items-center gap-3">
                {{ form.is_default }}
                <label class="text-sm font-medium">Set as default grading scheme</label>
            </div>

            <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-semibold">
                Save Grading Scheme
            </button>
        </form>
    </div>
</div>
{% endblock %}
