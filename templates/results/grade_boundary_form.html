{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h3 class="text-2xl font-bold mb-2">Create Grade Boundary</h3>
        <p class="text-slate-500 mb-6">Example: 70 - 100 = A = Excellent.</p>

        <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium mb-2">Grading Scheme</label>
                {{ form.grading_scheme }}
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Grade</label>
                {{ form.grade }}
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Minimum Score</label>
                {{ form.min_score }}
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Maximum Score</label>
                {{ form.max_score }}
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Remark</label>
                {{ form.remark }}
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Color</label>
                {{ form.color }}
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Point</label>
                {{ form.point }}
            </div>

            <div class="md:col-span-2">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold">
                    Save Grade Boundary
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
