{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h3 class="text-2xl font-bold mb-2">{{ page_title|default:"Delete Record" }}</h3>
        <p class="text-slate-600 mb-6">
            Are you sure you want to delete <strong>{{ object }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="flex gap-3">
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-semibold">
                    Yes, Delete
                </button>
                <a href="{{ cancel_url }}" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-6 py-3 rounded-xl font-semibold">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
